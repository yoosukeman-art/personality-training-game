name: Build Hougen EP1 Final Pro

on:
  push:
    branches:
      - chatgpt-hougen-audio-20261108
    paths:
      - ".github/workflows/hougen-ep1-final.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify ffmpeg
        run: |
          set -euxo pipefail
          ffmpeg -version >/dev/null
          fc-match "Noto Sans CJK JP" || true

      - name: Download approved motion clips
        run: |
          set -euxo pipefail
          curl -fL --retry 4 -o motion_a.mp4 "https://resource2.heygen.ai/videos/1a9a7cb27ddd4e12a450d414fc729ff9/1a9a7cb27ddd4e12a450d414fc729ff9/01a1b907-e9e8-767f-ac5c-98b608577e15.mp4"
          curl -fL --retry 4 -o motion_b.mp4 "https://resource2.heygen.ai/videos/1a9a7cb27ddd4e12a450d414fc729ff9/1a9a7cb27ddd4e12a450d414fc729ff9/01a1b908-4089-706e-b04c-7fea3bef1308.mp4"
          ffprobe -v error -show_entries format=duration -of default=nw=1 motion_a.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 motion_b.mp4

      - name: Recover existing VOICEVOX audio artifact
        run: |
          set -euxo pipefail
          mkdir recovered
          gh run download 42435942621 --repo yoosukeman-art/personality-training-game -n hougen-voicevox-audio-28 -D recovered
          test -f recovered/hougen_audio/ep01_seg01_spk11.wav
          test -f recovered/hougen_audio/ep01_seg02_spk10.wav
          test -f recovered/hougen_audio/ep01_seg03_spk11.wav
          test -f recovered/hougen_audio/ep01_seg04_spk10.wav

      - name: Build two VOICEVOX dialogue tracks
        run: |
          set -euxo pipefail
          ffmpeg -y -i recovered/hougen_audio/ep01_seg01_spk11.wav -i recovered/hougen_audio/ep01_seg02_spk10.wav -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,aresample=48000,aformat=channel_layouts=stereo,loudnorm=I=-16:LRA=7:TP=-1.5[a]" -map "[a]" voice_a.wav
          ffmpeg -y -i recovered/hougen_audio/ep01_seg03_spk11.wav -i recovered/hougen_audio/ep01_seg04_spk10.wav -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,aresample=48000,aformat=channel_layouts=stereo,loudnorm=I=-16:LRA=7:TP=-1.5[a]" -map "[a]" voice_b.wav
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 voice_a.wav > da.txt
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 voice_b.wav > db.txt

      - name: Retiming motion to narration
        run: |
          set -euxo pipefail
          DA="$(cat da.txt)"
          DB="$(cat db.txt)"
          VA="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 motion_a.mp4)"
          VB="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 motion_b.mp4)"
          FA="$(python -c "print(float('$DA')/float('$VA'))")"
          FB="$(python -c "print(float('$DB')/float('$VB'))")"
          ffmpeg -y -i motion_a.mp4 -i voice_a.wav -filter_complex "[0:v]setpts=PTS*${FA},scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=30[v]" -map "[v]" -map 1:a:0 -t "$DA" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k -ar 48000 -ac 2 part_a.mp4
          ffmpeg -y -i motion_b.mp4 -i voice_b.wav -filter_complex "[0:v]setpts=PTS*${FB},scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=30[v]" -map "[v]" -map 1:a:0 -t "$DB" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k -ar 48000 -ac 2 part_b.mp4
          printf "file 'part_a.mp4'\nfile 'part_b.mp4'\n" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy rough.mp4

      - name: Create restrained Japanese subtitles
        run: |
          python - <<'PY'
          import json, pathlib
          m=json.load(open('recovered/hougen_audio_manifest.json',encoding='utf-8'))
          e=sorted([x for x in m if x['ep']==1], key=lambda x:x['seg'])
          starts=[]; t=0.0
          for x in e:
              starts.append(t); t+=float(x['duration_sec'])
          def ts(v):
              h=int(v//3600); v-=h*3600
              mi=int(v//60); v-=mi*60
              s=int(v); cs=int(round((v-s)*100))
              if cs==100: s+=1; cs=0
              return f'{h}:{mi:02d}:{s:02d}.{cs:02d}'
          caps=[
              'リモコンが見つからない。\\Nこんな時、津軽弁では何と言う？',
              '「かちゃくちゃね」\\N＝ いらいらする',
              '物事がうまく進まず、\\N気持ちが落ち着かない時の一言。',
              '「かちゃくちゃね」\\N一度聞いたら耳に残る。'
          ]
          font='Noto Sans CJK JP'
          lines=['[Script Info]','ScriptType: v4.00+','PlayResX: 720','PlayResY: 1280','ScaledBorderAndShadow: yes','',
                 '[V4+ Styles]',
                 'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
                 f'Style: Subtitle,{font},35,&H00FFFFFF,&H000000FF,&H50000000,&H76000000,-1,0,0,0,100,100,0,0,3,0,0,2,54,54,72,1',
                 f'Style: Region,{font},24,&H00FFFFFF,&H000000FF,&H50000000,&H76000000,-1,0,0,0,100,100,0,0,3,0,0,7,24,24,24,1','',
                 '[Events]','Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text',
                 f'Dialogue: 0,{ts(0)},{ts(t)},Region,,0,0,0,,青森・津軽']
          for i,x in enumerate(e):
              st=starts[i]; en=st+float(x['duration_sec'])-0.08
              lines.append(f'Dialogue: 0,{ts(st)},{ts(en)},Subtitle,,0,0,0,,{caps[i]}')
          pathlib.Path('ep1.ass').write_text('\n'.join(lines),encoding='utf-8')
          PY

      - name: Burn subtitles and verify final MP4
        run: |
          set -euxo pipefail
          ffmpeg -y -i rough.mp4 -vf "ass=ep1.ass" -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 160k -ar 48000 -ac 2 -movflags +faststart hougen_ep01_FINAL_PRO.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json hougen_ep01_FINAL_PRO.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json hougen_ep01_FINAL_PRO.mp4
          ffmpeg -v error -i hougen_ep01_FINAL_PRO.mp4 -f null -
          test -s hougen_ep01_FINAL_PRO.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: hougen-ep01-final-pro
          path: hougen_ep01_FINAL_PRO.mp4
          if-no-files-found: error
          retention-days: 1

# trigger build
