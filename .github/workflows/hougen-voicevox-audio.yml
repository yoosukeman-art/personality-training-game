name: Temporary Hougen VOICEVOX Audio Build

on:
  push:
    branches:
      - chatgpt-hougen-audio-20261108
    paths:
      - ".github/workflows/hougen-voicevox-audio.yml"
      - "tools/hougen_voicevox_generate.py"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOICEVOX_VERSION: "0.17.1"
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download VOICEVOX Core downloader
        run: |
          set -euxo pipefail
          curl -fL --retry 4             "https://github.com/VOICEVOX/voicevox_core/releases/download/${VOICEVOX_VERSION}/download-linux-x64"             -o download
          chmod +x download

      - name: Download only required VOICEVOX runtime, models, and dictionary
        run: |
          set -euxo pipefail
          printf 'y\n' | ./download             --exclude c-api             --devices cpu             --models-pattern '[04].vvm'             --output voicevox_core
          test -f voicevox_core/models/vvms/0.vvm
          test -f voicevox_core/models/vvms/4.vvm
          test -f voicevox_core/dict/open_jtalk_dic_utf_8-1.11/sys.dic

      - name: Install VOICEVOX Python wheel
        run: |
          set -euxo pipefail
          python -m pip install --no-deps             "https://github.com/VOICEVOX/voicevox_core/releases/download/${VOICEVOX_VERSION}/voicevox_core-${VOICEVOX_VERSION}-cp310-abi3-manylinux_2_34_x86_64.whl"

      - name: Generate and verify 28 WAV files
        run: |
          set -euxo pipefail
          python tools/hougen_voicevox_generate.py
          test "$(find hougen_audio -maxdepth 1 -name '*.wav' | wc -l)" -eq 28
          python - <<'PY'
          import json
          m=json.load(open("hougen_audio_manifest.json",encoding="utf-8"))
          assert len(m)==28
          assert sorted(set(x["speaker"] for x in m)) == [10,11]
          assert all(x["duration_sec"] > 0.2 for x in m)
          print("verified", len(m), "files")
          print("duration_total", round(sum(x["duration_sec"] for x in m),2))
          PY

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: hougen-voicevox-audio-28
          path: |
            hougen_audio/
            hougen_audio_manifest.json
          if-no-files-found: error
          retention-days: 1
